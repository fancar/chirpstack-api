version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/brocaar/chirpstack-api/go/v3
    except:
      - buf.build/googleapis/googleapis
      - buf.build/grpc-ecosystem/grpc-gateway
plugins:
  # Go plugins
  - plugin: go
    out: go
    opt: 
      - paths=source_relative

  - plugin: go-grpc
    out: go
    opt:
      - paths=source_relative

  - plugin: grpc-gateway
    out: go
    opt:
      - paths=source_relative
      - logtostderr=true

  # OpenAPI/Swagger
  - plugin: openapiv2
    out: swagger
    opt:
      # json_names_for_fields=true
      # - json_names_for_fields=false # legacy format from v1

  # Python plugins - генерируем прямо в python/
  - plugin: buf.build/protocolbuffers/python
    out: python

  - plugin: buf.build/protocolbuffers/pyi
    out: python

  - plugin: buf.build/grpc/python
    out: python

  # JavaScript plugins (закомментированы - нужен отдельный плагин)
  # - plugin: buf.build/protocolbuffers/js
  #   out: js
  #   opt:
  #     - import_style=commonjs

  # Rust plugins (если нужно)
  # - plugin: rust
  #   out: rust

  # Java plugins (если нужно)
  # - plugin: java
  #   out: java
