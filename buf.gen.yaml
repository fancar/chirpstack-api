version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/brocaar/chirpstack-api/go/v3
    except:
      - buf.build/googleapis/googleapis
      - buf.build/grpc-ecosystem/grpc-gateway
plugins:
  - plugin: go
    out: go
    opt: 
      - paths=source_relative

  - plugin: go-grpc
    out: go
    opt:
      - paths=source_relative

  - plugin: grpc-gateway
    out: go
    opt:
      - paths=source_relative
      - logtostderr=true

  - plugin: openapiv2
    out: swagger
    opt:
      # json_names_for_fields=true
      # - json_names_for_fields=false # legacy format from v1

  # Python plugins - генерируем в python/v4/chirpstack_api/ (protobuf 4.x)
  - plugin: buf.build/protocolbuffers/python
    out: python/v4/chirpstack_api

  - plugin: buf.build/protocolbuffers/pyi
    out: python/v4/chirpstack_api

  - plugin: buf.build/grpc/python
    out: python/v4/chirpstack_api